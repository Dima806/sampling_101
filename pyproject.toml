[project]
name = "sampling-101"
version = "0.1.0"
description = "Sampling 101: your random sample is not random, and it is costing you"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.38",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "ty>=0.0.1a7",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbclient>=0.10",
]

# Virtual project: `uv sync` installs the dependencies but does not build this repo as a
# distribution. `src/` is imported from the repo root instead (see the pytest pythonpath
# below), which keeps the flat `src.montecarlo...` import paths that the notebooks, tests
# and app use, without publishing a top-level `src` package into the environment.
[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# N803/N806 forbid capitalised arguments and locals. The literature writes the envelope
# constant as M, the design matrix as X and the stratum count as N; matching the papers
# matters more than the naming rule in a teaching repo.
"src/**" = ["N803", "N806"]
"tests/**" = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# Resolves `from src.montecarlo.integration import ...` against the repo root.
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["src/visualisation.py"]

[tool.ty.environment]
python-version = "3.11"
